<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BELLA — Panel administracyjny</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0d0d0d;
  color:white;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111;
  border-bottom:1px solid #292929;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:bold;
  letter-spacing:5px;
}

button{
  border:0;
  cursor:pointer;
  font-weight:bold;
}

.logout{
  background:#292929;
  color:white;
  padding:11px 15px;
  border-radius:12px;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:15px;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login{
  width:calc(100% - 30px);
  max-width:430px;
  margin:60px auto;
  background:#181818;
  border:1px solid #292929;
  border-radius:20px;
  padding:25px;
}

.login h1{
  text-align:center;
  margin-bottom:25px;
}

/* INPUTS */

input,
select,
textarea{
  width:100%;
  background:#202020;
  color:white;
  border:1px solid #383838;
  border-radius:13px;
  padding:15px;
  font-size:16px;
  outline:none;
  margin:7px 0 15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#777;
}

label{
  color:#aaa;
  font-size:14px;
}

/* BUTTON */

.primary{
  width:100%;
  padding:15px;
  border-radius:13px;
  background:white;
  color:#111;
  font-size:16px;
}

.primary:disabled{
  opacity:.5;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

.stat{
  background:#181818;
  border:1px solid #292929;
  border-radius:16px;
  padding:17px;
  color:#999;
  font-size:14px;
}

.stat b{
  display:block;
  color:white;
  font-size:28px;
  margin-top:6px;
}

/* FORM */

.form{
  background:#181818;
  border:1px solid #292929;
  border-radius:20px;
  padding:18px;
  margin-bottom:25px;
}

.form h2{
  margin-bottom:18px;
}

.preview{
  width:100%;
  max-height:270px;
  object-fit:cover;
  border-radius:15px;
  margin-bottom:15px;
  display:none;
}

/* STATUS */

.status{
  display:none;
  background:#252525;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  color:#ddd;
}

/* DISHES */

.title{
  font-size:22px;
  margin-bottom:15px;
}

.dishes{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.card{
  background:#181818;
  border:1px solid #292929;
  border-radius:18px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:210px;
  object-fit:cover;
  display:block;
}

.no-photo{
  height:210px;
  background:#222;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#777;
}

.card-content{
  padding:16px;
}

.name{
  font-size:20px;
  font-weight:bold;
  margin-bottom:7px;
}

.price{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.category{
  display:inline-block;
  background:#292929;
  color:#aaa;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:12px;
}

.description{
  color:#aaa;
  font-size:14px;
  line-height:1.4;
  margin-bottom:15px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.edit{
  background:white;
  color:#111;
  padding:13px;
  border-radius:11px;
}

.delete{
  background:#7d2525;
  color:white;
  padding:13px;
  border-radius:11px;
}

.cancel{
  width:100%;
  margin-top:9px;
  background:#292929;
  color:white;
  padding:13px;
  border-radius:11px;
}

@media(max-width:380px){
  .stats{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">BELLA</div>

  <button
    id="logoutBtn"
    class="logout"
  >
    Wyloguj
  </button>
</header>


<!-- LOGIN -->

<div id="loginPage" class="login">

  <h1>Panel administracyjny</h1>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Hasło"
  >

  <button
    id="loginBtn"
    class="primary"
  >
    Zaloguj się
  </button>

  <div
    id="loginStatus"
    class="status"
  ></div>

</div>


<!-- ADMIN -->

<div
  id="adminPage"
  class="container hidden"
>

  <div class="stats">

    <div class="stat">
      Wszystkich dań
      <b id="total">0</b>
    </div>

    <div class="stat">
      Ze zdjęciem
      <b id="withPhoto">0</b>
    </div>

    <div class="stat">
      Bez zdjęcia
      <b id="withoutPhoto">0</b>
    </div>

    <div class="stat">
      Kategorii
      <b id="categories">0</b>
    </div>

  </div>


  <div class="form">

    <h2 id="formTitle">
      Dodaj danie
    </h2>

    <label>Nazwa</label>

    <input
      id="name"
      placeholder="Na przykład: Pizza Margherita"
    >


    <label>Cena</label>

    <input
      id="price"
      type="number"
      step="0.01"
      inputmode="decimal"
      placeholder="Na przykład: 29.99"
    >


    <label>Kategoria</label>

    <select id="category">

      <option value="new">Nowości</option>
      <option value="snacks">Przekąski</option>
      <option value="salads">Sałatki</option>
      <option value="soups">Zupy</option>
      <option value="hot">Dania główne</option>
      <option value="pizza">Pizza</option>
      <option value="fastfood">Fast Food</option>
      <option value="desserts">Desery</option>
      <option value="drinks">Napoje</option>
      <option value="coffee">Kawa</option>
      <option value="tea">Herbata</option>
      <option value="lemonades">Lemoniady</option>

    </select>


    <label>Opis</label>

    <textarea
      id="description"
      placeholder="Opis dania"
    ></textarea>


    <label>Składniki</label>

    <textarea
      id="ingredients"
      placeholder="Na przykład: ser, pomidory, bazylia"
    ></textarea>


    <label>Alergeny</label>

    <textarea
      id="allergens"
      placeholder="Na przykład: mleko, gluten"
    ></textarea>


    <label>Zdjęcie</label>

    <input
      id="photo"
      type="file"
      accept="image/*"
    >


    <img
      id="preview"
      class="preview"
    >


    <button
      id="saveBtn"
      class="primary"
    >
      Dodaj danie
    </button>


    <button
      id="cancelBtn"
      class="cancel hidden"
    >
      Anuluj
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>


  <div class="title">
    Wszystkie dania
  </div>

  <div
    id="dishes"
    class="dishes"
  ></div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
  "AIzaSyA3YFrHFBS8QQZD15BpqqS1j5SQtZ0kDeE",

  authDomain:
  "bella-ae79a.firebaseapp.com",

  projectId:
  "bella-ae79a",

  storageBucket:
  "bella-ae79a.firebasestorage.app",

  messagingSenderId:
  "127734379674",

  appId:
  "1:127734379674:web:c0351128cfb92aa63a9b23",

  measurementId:
  "G-MC83PF9WW8"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* CLOUDINARY */

const cloudName =
  "wtaymmya";

const uploadPreset =
  "bella_menu";


/* ELEMENTS */

const loginPage =
  document.getElementById(
    "loginPage"
  );

const adminPage =
  document.getElementById(
    "adminPage"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );

const email =
  document.getElementById(
    "email"
  );

const password =
  document.getElementById(
    "password"
  );

const loginStatus =
  document.getElementById(
    "loginStatus"
  );

const nameInput =
  document.getElementById(
    "name"
  );

const priceInput =
  document.getElementById(
    "price"
  );

const categoryInput =
  document.getElementById(
    "category"
  );

const descriptionInput =
  document.getElementById(
    "description"
  );

const ingredientsInput =
  document.getElementById(
    "ingredients"
  );

const allergensInput =
  document.getElementById(
    "allergens"
  );

const photoInput =
  document.getElementById(
    "photo"
  );

const preview =
  document.getElementById(
    "preview"
  );

const saveBtn =
  document.getElementById(
    "saveBtn"
  );

const cancelBtn =
  document.getElementById(
    "cancelBtn"
  );

const statusBox =
  document.getElementById(
    "status"
  );

const dishesBox =
  document.getElementById(
    "dishes"
  );


let editingId = null;

let currentPhotoUrl = "";


/* STATUS */

function status(
  element,
  text
){

  element.textContent =
    text;

  element.style.display =
    "block";

}


/* LOGIN */

loginBtn.onclick =
async () => {

  const mail =
    email.value.trim();

  const pass =
    password.value;


  if(!mail || !pass){

    status(
      loginStatus,
      "Wpisz email i hasło"
    );

    return;
  }


  loginBtn.disabled =
    true;

  loginBtn.textContent =
    "Logowanie...";


  try{

    await signInWithEmailAndPassword(
      auth,
      mail,
      pass
    );

  }catch(error){

    console.error(error);

    status(
      loginStatus,
      "Nieprawidłowy email lub hasło"
    );

  }


  loginBtn.disabled =
    false;

  loginBtn.textContent =
    "Zaloguj się";

};


/* LOGOUT */

logoutBtn.onclick =
async () => {

  await signOut(auth);

};


/* AUTH */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      loginPage.classList.add(
        "hidden"
      );

      adminPage.classList.remove(
        "hidden"
      );

      loadDishes();

    }else{

      loginPage.classList.remove(
        "hidden"
      );

      adminPage.classList.add(
        "hidden"
      );

    }

  }

);


/* UPLOAD PHOTO */

async function uploadPhoto(
  file
){

  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );

  formData.append(
    "upload_preset",
    uploadPreset
  );


  const response =
    await fetch(

      `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`,

      {
        method:"POST",
        body:formData
      }

    );


  if(!response.ok){

    throw new Error(
      "Błąd podczas przesyłania zdjęcia"
    );

  }


  const data =
    await response.json();


  return data.secure_url;

}


/* PHOTO PREVIEW */

photoInput.onchange =
() => {

  const file =
    photoInput.files[0];


  if(!file){

    preview.style.display =
      "none";

    return;
  }


  preview.src =
    URL.createObjectURL(
      file
    );

  preview.style.display =
    "block";

};


/* SAVE */

saveBtn.onclick =
async () => {

  const name =
    nameInput.value.trim();

  const price =
    priceInput.value.trim();


  if(!name){

    status(
      statusBox,
      "Wpisz nazwę"
    );

    return;
  }


  if(!price){

    status(
      statusBox,
      "Wpisz cenę"
    );

    return;
  }


  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "Zapisywanie...";


  try{

    let photo =
      currentPhotoUrl;


    if(photoInput.files[0]){

      photo =
        await uploadPhoto(
          photoInput.files[0]
        );

    }


    const data = {

      name:name,

      price:Number(price),

      category:
        categoryInput.value,

      description:
        descriptionInput.value.trim(),

      ingredients:
        ingredientsInput.value.trim(),

      allergens:
        allergensInput.value.trim(),

      photo:photo

    };


    if(editingId){

      await updateDoc(

        doc(
          db,
          "dishes",
          editingId
        ),

        data

      );

      status(
        statusBox,
        "Danie zostało zaktualizowane ✓"
      );

    }else{

      await addDoc(

        collection(
          db,
          "dishes"
        ),

        data

      );

      status(
        statusBox,
        "Danie zostało dodane ✓"
      );

    }


    resetForm();

    await loadDishes();


  }catch(error){

    console.error(error);

    status(
      statusBox,
      "Błąd: " +
      error.message
    );

  }


  saveBtn.disabled =
    false;

  saveBtn.textContent =
    editingId
    ?
    "Zapisz zmiany"
    :
    "Dodaj danie";

};


/* LOAD */

async function loadDishes(){

  dishesBox.innerHTML =
    "<div class='status' style='display:block'>Ładowanie...</div>";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "dishes"
        )
      );


    dishesBox.innerHTML =
      "";


    let total = 0;

    let withPhoto = 0;

    let withoutPhoto = 0;

    const cats =
      new Set();


    snapshot.forEach(
      item => {

        const data =
          item.data();


        total++;

        cats.add(
          data.category || ""
        );


        if(data.photo){
          withPhoto++;
        }else{
          withoutPhoto++;
        }


        const card =
          document.createElement(
            "div"
          );

        card.className =
          "card";


        card.innerHTML = `

          ${
            data.photo

            ?

            `<img
              src="${safe(data.photo)}"
              alt=""
            >`

            :

            `<div class="no-photo">
              BELLA
            </div>`
          }

          <div class="card-content">

            <div class="name">
              ${safe(data.name || "")}
            </div>

            <div class="price">
              ${data.price || 0} PLN
            </div>

            <div class="category">
              ${safe(data.category || "")}
            </div>

            <div class="description">
              ${safe(
                data.description ||
                "Brak opisu"
              )}
            </div>

            <div class="actions">

              <button
                class="edit"
              >
                Edytuj
              </button>

              <button
                class="delete"
              >
                Usuń
              </button>

            </div>

          </div>

        `;


        card
          .querySelector(
            ".edit"
          )
          .onclick =
          () => editDish(
            item.id,
            data
          );


        card
          .querySelector(
            ".delete"
          )
          .onclick =
          () => deleteDish(
            item.id
          );


        dishesBox.appendChild(
          card
        );

      }
    );


    document.getElementById(
      "total"
    ).textContent =
      total;

    document.getElementById(
      "withPhoto"
    ).textContent =
      withPhoto;

    document.getElementById(
      "withoutPhoto"
    ).textContent =
      withoutPhoto;

    document.getElementById(
      "categories"
    ).textContent =
      cats.size;


  }catch(error){

    console.error(error);

    dishesBox.innerHTML =
      "<div class='status' style='display:block'>Błąd ładowania</div>";

  }

}


/* EDIT */

function editDish(
  id,
  data
){

  editingId =
    id;

  currentPhotoUrl =
    data.photo || "";


  nameInput.value =
    data.name || "";

  priceInput.value =
    data.price || "";

  categoryInput.value =
    data.category || "new";

  descriptionInput.value =
    data.description || "";

  ingredientsInput.value =
    data.ingredients || "";

  allergensInput.value =
    data.allergens || "";


  if(data.photo){

    preview.src =
      data.photo;

    preview.style.display =
      "block";

  }else{

    preview.style.display =
      "none";

  }


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edytuj danie";


  saveBtn.textContent =
    "Zapisz zmiany";


  cancelBtn.classList.remove(
    "hidden"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* DELETE */

async function deleteDish(
  id
){

  if(
    !confirm(
      "Czy usunąć danie?"
    )
  ){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "dishes",
        id
      )
    );

    await loadDishes();

  }catch(error){

    console.error(error);

    alert(
      "Błąd podczas usuwania"
    );

  }

}


/* CANCEL */

cancelBtn.onclick =
() => {

  resetForm();

};


/* RESET */

function resetForm(){

  editingId =
    null;

  currentPhotoUrl =
    "";

  nameInput.value =
    "";

  priceInput.value =
    "";

  categoryInput.value =
    "new";

  descriptionInput.value =
    "";

  ingredientsInput.value =
    "";

  allergensInput.value =
    "";

  photoInput.value =
    "";

  preview.src =
    "";

  preview.style.display =
    "none";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Dodaj danie";


  saveBtn.textContent =
    "Dodaj danie";


  cancelBtn.classList.add(
    "hidden"
  );

}


/* SECURITY */

function safe(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>
<style>
 


    *{
  -webkit-tap-highlight-color: transparent;
}

button,
a,
.menu-item{
  -webkit-tap-highlight-color: transparent;
  outline:none;
}

button:focus,
button:active,
a:focus,
a:active,
.menu-item:focus,
.menu-item:active{
  outline:none;
  box-shadow:none;
}
  </style>
</body>
</html>
